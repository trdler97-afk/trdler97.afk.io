  <!-- Canonical URL -->
  <link rel="canonical" href="https://yourdomain.com/about.html">

  <!-- Breadcrumb Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
      {
        "@type": "ListItem",
        "position": 1,
        "name": "Home",
        "item": "https://yourdomain.com/"
      },
      {
        "@type": "ListItem",
        "position": 2,

  <style>
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #fff; text-align: center;
    }
    body {
      background: url('MAKAZI.webp') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }
    /* Overlay for readability */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.55);
      z-index: 0;
    }
    h2 {
      margin: 40px 20px;
      color: #ffffff;
      font-size: 2rem;
      font-weight: 600;
      position: relative;
      z-index: 1;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }
    .arrow-buttons {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 1;
    }
    .arrow-btn {
      display: inline-block;
      margin: 0 15px;
      padding: 14px 20px;
      background: #009977;
      color: white;
      text-decoration: none;
      border-radius: 50%;
      font-weight: bold;
      font-size: 22px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: background 0.3s ease, transform 0.2s ease;
    }
    .arrow-btn:hover {
      background: #00cc99;
      transform: scale(1.1);
    }
    @media (max-width: 768px) {
      body {
        background: url('MAKAZI.webp') no-repeat center center;
        background-size: contain;
        background-attachment: scroll;
        background-color: #000;
      }
      h2 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
